name: Actualizar euríbor (BCE)

on:
  schedule:
    # Día 2 de cada mes a las 07:00 UTC (el BCE publica la media mensual a día 1)
    - cron: "0 7 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-euribor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar datos del BCE y regenerar constantes
        run: node scripts/update-euribor.mjs

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet -- src/constants/euribor-values.ts; then
            echo "Sin cambios en los datos del euríbor"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/constants/euribor-values.ts
          git commit -m "chore(data): actualizar euríbor desde el BCE"
          git push
